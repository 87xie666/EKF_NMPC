# ==========================================================
# 1. 控制器服务器 (Controller Server)
# ==========================================================
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0      # 必须是 double
    min_x_velocity_threshold: 0.001 # 必须是 double
    min_y_velocity_threshold: 0.5   # 必须是 double
    min_theta_velocity_threshold: 0.001 # 必须是 double
    failure_tolerance: 0.3          # 必须是 double
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1 # 必须是 double
      movement_time_allowance: 10.0 # 必须是 double

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25       # 必须是 double
      yaw_goal_tolerance: 0.25      # 必须是 double
      stateful: True

    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "my_nav2_plugins/SlipAwareNMPC"
      prediction_horizon: 20        # 必须是 int
      control_period: 0.05          # 必须是 double

# ==========================================================
# 2. 局部代价地图 (Local Costmap)
# ==========================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0        # 必须是 double
      publish_frequency: 10.0       # 必须是 double
      global_frame: odom
      robot_base_frame: base_footprint 
      use_sim_time: True
      rolling_window: True
      width: 4                      # 必须是 int
      height: 4                     # 必须是 int
      resolution: 0.05              # 必须是 double
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0  # 必须是 double
          clearing: True
          marking: True
          data_type: "LaserScan"
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0    # 必须是 double
        inflation_radius: 0.25      # 必须是 double

# ==========================================================
# 3. 全局代价地图 (Global Costmap)
# ==========================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0         # 必须是 double
      publish_frequency: 2.0        # 必须是 double
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      robot_radius: 0.25            # 必须是 double
      resolution: 0.05              # 必须是 double
      track_unknown_space: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0  # 必须是 double
          clearing: True
          marking: True
          data_type: "LaserScan"
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0    # 必须是 double
        inflation_radius: 0.35      # 必须是 double

# ==========================================================
# 4. 路径规划器 (Planner Server)
# ==========================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0 # 必须是 double
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5                # 必须是 double
      use_astar: False
      allow_unknown: True

# ==========================================================
# 5. 行为树导航器 (BT Navigator)
# ==========================================================
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10            # 必须是 int
    default_server_timeout: 20      # 必须是 int

# ==========================================================
# 6. 异常恢复行为服务器 (Behavior Server)
# ==========================================================
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0           # 必须是 double
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1        # 必须是 double
    use_sim_time: True

# ==========================================================
# 7. 航点跟踪与平滑器
# ==========================================================
waypoint_follower:
  ros__parameters:
    loop_rate: 20                   # 必须是 int
    stop_on_failure: False
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200  # 必须是 int
    use_sim_time: True

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0       # 必须是 double
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.5, 0.0, 0.5]   # 数组必须是 double
    min_velocity: [-0.5, 0.0, -0.5] # 数组必须是 double
    max_accel: [1.0, 0.0, 1.0]      # 数组必须是 double
    max_decel: [-1.0, 0.0, -1.0]    # 数组必须是 double
    odom_topic: "odom"
    odom_duration: 0.1              # 必须是 double

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10            # 必须是 double (科学计数法被视为 double)
      max_its: 1000                 # 必须是 int
      do_refinement: True